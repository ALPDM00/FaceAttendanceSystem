{% extends "base.html" %}
{% block title %}新用户注册 - 人脸识别考勤系统{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-5">
            <div class="text-center mb-4">

                <i class="bi bi-person-plus-fill fs-1 text-success"></i>

                <h3 class="fw-bold">新员工注册</h3>
                <p class="opacity-75 small">请填写真实姓名以便考勤统计</p>
            </div>
            
            <form method="POST" action="{{ url_for('signup') }}">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" placeholder="真实姓名" required>
                    <label for="username" style="color: gray;">用户名</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" placeholder="设置密码" required>
                    <label for="password" style="color: gray;">设置密码</label>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg shadow-sm">确认注册</button>
                    <a href="{{ url_for('login') }}" class="btn btn-lg btn-outline-secondary">返回登录</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
