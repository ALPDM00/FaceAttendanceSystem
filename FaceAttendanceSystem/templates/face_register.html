{% extends "base.html" %}

{% block title %}人脸注册 - 人脸识别考勤系统{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="glass-card rounded-4">
            <div class="card-header bg-transparent border-bottom border-secondary border-opacity-10 py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill text-warning"></i> 人脸信息录入</h4>
            </div>
            <div class="card-body p-4">
                <!-- 提示框改为半透明圆角 -->
                <div class="alert alert-info border-0 rounded-4 bg-info bg-opacity-10 text-info d-flex align-items-center">
                    <i class="bi bi-lightbulb-fill me-3 fs-4"></i>
                    <div><strong>提示：</strong> 请摘下口罩和眼镜，保持光线充足，正视摄像头。</div>
                </div>

                <div class="video-container mb-4 shadow-lg rounded-4 overflow-hidden bg-black">
                    <video id="video" autoplay playsinline style="width:100%; border-radius: 16px;"></video>
                </div>

                <div class="row align-items-center g-3">
                    <div class="col-md-5 text-center">
                        <p class="mb-2 fw-bold opacity-75">Step 1. 捕获照片</p>
                        <button id="capture" class="btn btn-primary w-100 py-2 rounded-pill shadow-sm">
                            <i class="bi bi-camera-fill"></i> 拍照定格
                        </button>
                    </div>

                    <div class="col-md-2 text-center">
                        <i class="bi bi-arrow-right display-6 opacity-50 d-none d-md-block"></i>
                        <i class="bi bi-arrow-down display-6 opacity-50 d-md-none"></i>
                    </div>

                    <div class="col-md-5 text-center">
                        <p class="mb-2 fw-bold opacity-75">Step 2. 确认上传</p>
                        <div class="d-flex gap-2 align-items-center">
                            <!-- 预览图圆角化 -->
                            <div class="face-preview mx-0 rounded-4 border border-2 border-white shadow-sm" style="width: 60px; height: 60px; overflow: hidden;">
                                <img id="photo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.3;">
                            </div>
                            <button id="register" class="btn btn-success flex-grow-1 rounded-pill shadow-sm" disabled>
                                <i class="bi bi-cloud-upload"></i> 确认注册
                            </button>
                        </div>
                         <canvas id="canvas" style="display:none;"></canvas>
                    </div>
                </div>

                <div id="result" class="mt-4"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
/* JS 逻辑与原版保持一致 */
let stream = null;
let photoData = null;

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
        document.getElementById('video').srcObject = stream;
    } catch (err) { alert('摄像头启动失败'); }
}

document.getElementById('capture').addEventListener('click', () => {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const photo = document.getElementById('photo');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    photoData = canvas.toDataURL('image/jpeg');
    photo.src = photoData; photo.style.opacity = 1;
    document.getElementById('register').disabled = false;
});

document.getElementById('register').addEventListener('click', async function() {
    if (!photoData) return;
    const btn = this;
    const originalContent = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

    try {
        const response = await fetch('/api/register-face', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: photoData })
        });
        const result = await response.json();
        const resultDiv = document.getElementById('result');
        if (result.success) {
            resultDiv.innerHTML = `<div class="alert alert-success rounded-pill border-0"><i class="bi bi-check-circle"></i> ${result.message}</div>`;
            setTimeout(() => { btn.disabled = true; btn.innerHTML = originalContent; }, 2000);
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger rounded-pill border-0"><i class="bi bi-x-circle"></i> ${result.message}</div>`;
            btn.disabled = false; btn.innerHTML = originalContent;
        }
    } catch (e) {
        alert('网络错误'); btn.disabled = false; btn.innerHTML = originalContent;
    }
});
window.addEventListener('DOMContentLoaded', startCamera);
window.addEventListener('beforeunload', () => { if(stream) stream.getTracks().forEach(t => t.stop()); });
</script>
{% endblock %}
